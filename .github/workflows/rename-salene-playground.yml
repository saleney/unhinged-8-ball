name: Rename Salene playground navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename navigation text
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "← back to Salene’s Corner": "← Back to Salene’s Playground",
              "← Back to Salene’s Corner": "← Back to Salene’s Playground",
              "← back to Salene's Corner": "← Back to Salene’s Playground",
              "← Back to Salene's Corner": "← Back to Salene’s Playground",
              "✦ Salene’s corner": "← Back to Salene’s Playground",
              "✦ Salene’s Corner": "← Back to Salene’s Playground",
          }
          for p in Path('.').rglob('*.html'):
              text = p.read_text()
              new = text
              for old, repl in replacements.items(): new = new.replace(old, repl)
              if new != text: p.write_text(new)
          PY
          rm .github/workflows/rename-salene-playground.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "Rename return links to Salene's Playground" && git push; fi